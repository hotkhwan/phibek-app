<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="phibekGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B84B"/>
      <stop offset="100%" stop-color="#C9952A"/>
    </linearGradient>
  </defs>
  <!-- almond eye outline -->
  <path
    d="M3 32 C 14 14, 50 14, 61 32 C 50 50, 14 50, 3 32 Z"
    fill="none"
    stroke="url(#phibekGold)"
    stroke-width="1.6"
    stroke-linejoin="round"
  />
  <!-- inner eye -->
  <path
    d="M9 32 C 18 19, 46 19, 55 32 C 46 45, 18 45, 9 32 Z"
    fill="none"
    stroke="url(#phibekGold)"
    stroke-width="1"
    opacity="0.65"
  />
  <!-- sun rays -->
  <g stroke="url(#phibekGold)" stroke-width="1.2" stroke-linecap="round">
    <line x1="32" y1="14" x2="32" y2="20"/>
    <line x1="32" y1="44" x2="32" y2="50"/>
    <line x1="14" y1="32" x2="20" y2="32"/>
    <line x1="44" y1="32" x2="50" y2="32"/>
    <line x1="20" y1="20" x2="24" y2="24"/>
    <line x1="40" y1="40" x2="44" y2="44"/>
    <line x1="44" y1="20" x2="40" y2="24"/>
    <line x1="20" y1="44" x2="24" y2="40"/>
  </g>
  <!-- sun core -->
  <circle cx="32" cy="32" r="6" fill="url(#phibekGold)"/>
  <circle cx="32" cy="32" r="2.5" fill="#0F1C3F" opacity="0.45"/>
</svg>
