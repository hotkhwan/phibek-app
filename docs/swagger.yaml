  /ingest/reprovisionWorkspace:
    post:
      description: |-
        Idempotent recovery surface for orgs whose workspace provisioning failed or never completed.
        Eligibility: triggers a gw provision call when `workspaceId == ""` OR `provisionStatus != "active"`.
        No-force guarantee: if the org is already `active`, returns `idempotent=true` without calling gw.
        Auth: caller must hold `organization.manage` on activeOrg, OR have `platformRole=administrator` (JWT `role` claim).
        Two routes share this handler — `/ingest/reprovisionWorkspace` (preferred) and `/ingest/enableWebhook` (deprecated alias).
      produces:
      - application/json
      responses:
        "200":
          description: code=SUCCESS — completed or idempotent (already active)
          schema:
            $ref: '#/definitions/gmod.SuccessDataResponse'
        "202":
          description: code=ACCEPTED — async provision triggered (saasPublic)
          schema:
            $ref: '#/definitions/gmod.SuccessDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gmod.ApiErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gmod.ApiErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/gmod.ApiErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gmod.ApiErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/gmod.ApiErrorResponse'
      security:
      - BearerAuth: []
      summary: Reprovision phibek workspace for an org
      tags:
      - Authorization
  /ingest/syncDeliveryTarget:
    post:
      description: |-
        One-shot fallback for workspaces provisioned before Phase B.
        Registers the klynx delivery target (mode=klynx) with gw for the active org's workspace.
        Idempotent — safe to call multiple times.
      produces:
      - application/json
      responses:
        "200":
