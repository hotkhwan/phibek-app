info:
  contact: {}
  description: REST API for Klynx system
  title: Klynx API
  version: 3.1.1
paths:
  /admin/analytics/cameraUsage:
    get:
      description: Returns every camera in the active org with its play-count for
        the window. Cameras with zero plays are included so the operator sees the
        full denominator. Summary fields are filter-independent (org-wide); see contract
        for details.
      parameters:
      - description: Active Org ID
        in: header
        name: X-Active-Org
        required: true
        type: string
      - description: Window start (RFC3339 UTC or YYYY-MM-DD)
        in: query
        name: from
